<!-- LOCAL VISITOR BADGE BLOCK -->
<section class="bg-cardBg p-4 rounded-lg border border-neutral-800 flex flex-col sm:flex-row items-center justify-between gap-4">
    <div class="flex items-center space-x-3">
        <span class="text-2xl">🐾</span>
        <div>
            <div class="text-xs text-neutral-400 font-semibold uppercase tracking-wider">Besucher-Status</div>
            <div id="visitor-text" class="text-sm font-bold text-white">Standort wird geprüft...</div>
        </div>
    </div>
    
    <div class="flex items-center gap-3">
        <button id="gps-btn" onclick="checkExactGPS()" class="text-xs bg-neutral-800 hover:bg-brandRed text-neutral-300 hover:text-white px-3 py-1.5 rounded border border-neutral-700 transition-colors flex items-center gap-1 font-medium">
            📍 GPS Genauigkeit
        </button>
        <div id="visitor-tag" class="hidden px-3 py-1 rounded text-xs font-bold uppercase tracking-wider"></div>
    </div>
</section>
